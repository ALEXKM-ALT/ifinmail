                            "tertiary-container": "#757778",

<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #c2c6d8;
            border-radius: 20px;
        }
    </style>

<body class="bg-background text-on-background h-screen w-full flex flex-col font-body-md overflow-hidden">
<!-- TopAppBar equivalent for compose -->
<header class="flex justify-between items-center px-gutter h-16 w-full bg-surface border-b border-outline-variant/30 flex-shrink-0">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors active:scale-95 duration-100 flex items-center justify-center" id="close-btn">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-on-surface" id="compose-title">New Message</h1>
</div>
<div class="flex items-center gap-2">
<button class="bg-primary text-on-primary rounded-full px-4 py-2 flex items-center gap-2 hover:bg-primary/90 transition-colors shadow-sm text-label-lg font-label-lg" id="send-btn">
                Send
                <span class="material-symbols-outlined text-[18px]" data-icon="send" data-weight="fill">send</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col w-full overflow-hidden">
<!-- Headers -->
<div class="flex flex-col px-gutter py-2 border-b border-outline-variant/20 flex-shrink-0 bg-surface">
<div class="flex items-center py-3 border-b border-outline-variant/10">
<label class="text-on-surface-variant w-12 text-label-lg font-label-lg" for="to-field">To</label>
<input class="flex-grow bg-transparent border-none focus:ring-0 p-0 text-body-md font-body-md text-on-surface placeholder-on-surface-variant/50" id="to-field" placeholder="Recipient email" type="text"/>
</div>
<div class="flex items-center py-3">
<input class="flex-grow bg-transparent border-none focus:ring-0 p-0 text-body-lg font-body-lg text-on-surface placeholder-on-surface-variant/50 font-semibold" id="subject-field" placeholder="Subject" type="text"/>
</div>
</div>
<!-- Body Text Area -->
<div class="flex-grow relative bg-surface p-gutter overflow-y-auto">
<textarea class="w-full h-full bg-transparent border-none focus:ring-0 p-0 text-body-md font-body-md text-on-surface resize-none placeholder-on-surface-variant/50" id="body-field" placeholder="Compose email..."></textarea>
</div>
<!-- Formatting Toolbar -->
<div class="flex items-center justify-between px-gutter py-2 bg-surface-container border-t border-outline-variant/20 flex-shrink-0">
<div class="flex items-center gap-1">
<button class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-lg transition-colors active:scale-95" title="Bold">
<span class="material-symbols-outlined" data-icon="format_bold">format_bold</span>
</button>
<button class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-lg transition-colors active:scale-95" title="Italic">
<span class="material-symbols-outlined" data-icon="format_italic">format_italic</span>
</button>
<button class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-lg transition-colors active:scale-95" title="Underline">
<span class="material-symbols-outlined" data-icon="format_underlined">format_underlined</span>
</button>
<div class="w-[1px] h-6 bg-outline-variant/30 mx-1"></div>
<button class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-lg transition-colors active:scale-95" title="Bulleted list">
<span class="material-symbols-outlined" data-icon="format_list_bulleted">format_list_bulleted</span>
</button>
</div>
<div class="flex items-center gap-1">
<button class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-lg transition-colors active:scale-95" id="attach-btn" title="Attach file">
<span class="material-symbols-outlined" data-icon="attach_file">attach_file</span>
</button>
</div>
</div>
</main>
<input class="hidden" id="file-input" type="file" multiple=""/>
<script src="../js/mail-data.js"></script>
<script src="js/shared.js"></script>
<script>
(function() {
    'use strict';
    const M = window.IFINMAIL_MOBILE;
    M.requireSession();

    const session = M.getSession();
    const prefill = M.mLoad(M.KEYS.composePrefill, null);

    const toField = document.getElementById('to-field');
    const subjectField = document.getElementById('subject-field');
    const bodyField = document.getElementById('body-field');
    let attachments = [];

    if (prefill) {
        if (prefill.to) toField.value = prefill.to;
        if (prefill.subject) subjectField.value = prefill.subject;
        if (prefill.body) bodyField.value = prefill.body;
        if (prefill.title) document.getElementById('compose-title').textContent = prefill.title;
        M.mSave(M.KEYS.composePrefill, null);
    }

    function send() {
        const toRaw = toField.value.trim();
        if (!toRaw) {
            alert('Please enter a recipient');
            toField.focus();
            return;
        }
        const subject = subjectField.value.trim() || '(no subject)';
        const body = bodyField.value;
        const to = toRaw.split(',').map(function(s) { return s.trim(); })
            .filter(Boolean)
            .map(function(addr) { return { name: addr.split('@')[0], email: addr }; });

        const sent = {
            id: 's' + Date.now(),
            folder: 'sent',
            from: { name: session.name, email: session.email },
            to: to,
            cc: [],
            bcc: [],
            subject: subject,
            preview: body.split('\n')[0].slice(0, 80),
            body: body,
            date: new Date().toISOString(),
            read: true,
            starred: false,
            important: false,
            labels: [],
            attachments: attachments
        };
        const emails = M.getEmails();
        emails.push(sent);
        M.saveEmails(emails);
        window.location.href = 'inbox.html';
    }

    document.getElementById('send-btn').addEventListener('click', send);

    document.getElementById('close-btn').addEventListener('click', function() {
        const hasContent = toField.value.trim() || subjectField.value.trim() || bodyField.value.trim();
        if (hasContent && confirm('Save this message as a draft?')) {
            const draft = {
                id: 'd' + Date.now(),
                folder: 'drafts',
                from: { name: session.name, email: session.email },
                to: toField.value.split(',').map(function(s) { return s.trim(); })
                    .filter(Boolean).map(function(addr) { return { name: addr.split('@')[0], email: addr }; }),
                cc: [],
                bcc: [],
                subject: subjectField.value.trim(),
                preview: bodyField.value.split('\n')[0].slice(0, 80),
                body: bodyField.value,
                date: new Date().toISOString(),
                read: true,
                starred: false,
                important: false,
                labels: [],
                attachments: attachments,
                draft: true
            };
            const emails = M.getEmails();
            emails.push(draft);
            M.saveEmails(emails);
        }
        window.location.href = 'inbox.html';
    });

    const fileInput = document.getElementById('file-input');
    document.getElementById('attach-btn').addEventListener('click', function() { fileInput.click(); });
    fileInput.addEventListener('change', function() {
        Array.from(fileInput.files).forEach(function(file) {
            const size = file.size / 1024 / 1024;
            attachments.push({
                name: file.name,
                size: size >= 1 ? size.toFixed(1) + ' MB' : Math.max(1, Math.round(size * 1024)) + ' KB'
            });
        });
        fileInput.value = '';
    });
})();
</script>
</body></html>
