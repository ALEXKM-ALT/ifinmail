<body class="bg-background text-on-surface h-full flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-background w-full top-0 flex justify-center items-center px-container-padding py-base relative z-10">
<!-- Minimal spacing at top for mobile auth screens -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center items-center px-container-padding relative">
<!-- Subtle Background Accent (optional, drawn from modern corporate style) -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none opacity-20 bg-image-container z-0"></div>
<div class="w-full max-w-md bg-surface-container-lowest p-container-padding rounded-xl border border-surface-container-highest shadow-sm relative z-10">
<!-- Branding Header -->
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center mb-stack-sm">
<img alt="IFINMAIL" class="rounded-full shadow-sm" src="../assets/icon.jpg" style="width: 40px; height: 40px; object-fit: cover;"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">IFINMAIL</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure. Private. Yours.</p>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-stack-md" id="signin-form">
<!-- Email Field -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="email">email</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-DEFAULT focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm bg-transparent transition-colors font-body-md text-body-md text-on-surface placeholder-outline" id="email" name="email" placeholder="Email Address" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-DEFAULT focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm bg-transparent transition-colors font-body-md text-body-md text-on-surface placeholder-outline" id="password" name="password" placeholder="Password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between mt-stack-sm">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded-DEFAULT bg-transparent cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-sm text-label-sm text-on-surface-variant cursor-pointer" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-label-lg text-label-lg text-primary hover:underline hover:text-primary-fixed-variant transition-colors" href="#" id="forgot-link">
                            Forgot password?
                        </a>
</div>
</div>
<!-- Error -->
<div class="hidden text-sm text-on-error-container bg-error-container rounded-lg px-3 py-2" id="error-box"></div>
<!-- Primary CTA -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-DEFAULT shadow-[0px_4px_12px_rgba(0,0,0,0.05)] text-on-primary bg-primary hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary font-label-lg text-label-lg uppercase tracking-wider transition-all duration-200 mt-stack-sm" id="signin-btn" type="submit">
                    SIGN IN
                </button>
</form>
<!-- Secondary Actions -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account?
                    <a class="font-label-lg text-label-lg text-primary hover:underline ml-1 transition-colors" href="create.html">
                        Create account
                    </a>
</p>
</div>
</div>
</main>
<script src="../js/mail-data.js"></script>
<script src="js/shared.js"></script>
<script>
        document.getElementById('toggle-password').addEventListener('click', function() {
            const pwdInput = document.getElementById('password');
            const icon = this.querySelector('span');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        });

        document.getElementById('forgot-link').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Password reset link has been sent to your email.');
        });

        const M = window.IFINMAIL_MOBILE;
        const errorBox = document.getElementById('error-box');

        document.getElementById('signin-form').addEventListener('submit', function(e) {
            e.preventDefault();
            errorBox.classList.add('hidden');

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errorBox.textContent = 'Please enter a valid email address.';
                errorBox.classList.remove('hidden');
                return;
            }
            if (!password) {
                errorBox.textContent = 'Please enter your password.';
                errorBox.classList.remove('hidden');
                return;
            }

            const createdUser = M.getCreatedUsers().find(function(u) { return u.email === email; });
            const demoPasswords = { 'alex@example.com': 'password', 'alex@ifinmail.com': 'blaise7128', 'admin@example.com': 'admin123' };
            const valid = (createdUser && createdUser.password === password) ||
                (demoPasswords[email] !== undefined && demoPasswords[email] === password);

            if (!valid) {
                errorBox.textContent = 'Invalid email or password. Try alex@example.com / password';
                errorBox.classList.remove('hidden');
                return;
            }

            const session = createdUser ? { name: createdUser.name, email: createdUser.email } : M.getDemoUser(email);
            M.mSave(M.KEYS.session, session);
            window.location.href = 'inbox.html';
        });
    </script>
</body></html>
